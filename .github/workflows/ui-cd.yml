name: ui-cd

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options: [staging, production]

concurrency:
  group: ui-cd-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ${{ github.repository_owner }}/tradebridge-ui

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write

    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      image-tag: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Deployment summary
        run: |
          echo "### TradeBridge UI deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Environment: ${{ github.event.inputs.environment || 'staging' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: ghcr.io/${{ env.IMAGE_NAME }}@${{ needs.build-and-push.outputs.image-digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tag: ${{ needs.build-and-push.outputs.image-tag }}" >> "$GITHUB_STEP_SUMMARY"

      # --- Hook your actual deployment here ---
      # Examples:
      #   - AWS ECS: aws ecs update-service --cluster ... --service ... --force-new-deployment
      #   - Kubernetes: kubectl set image deployment/tradebridge-ui ui=ghcr.io/...
      #   - SSH-based: rsync/scp + systemctl restart
      - name: Deploy (placeholder)
        run: |
          echo "TODO: wire deployment target (ECS / k8s / SSH)"
          echo "Image: ghcr.io/${{ env.IMAGE_NAME }}@${{ needs.build-and-push.outputs.image-digest }}"