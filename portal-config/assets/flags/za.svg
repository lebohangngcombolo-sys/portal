<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 20" width="30" height="20" aria-label="South Africa">
  <title>South Africa</title>
  <!-- Base red band -->
  <rect width="30" height="10" y="10" fill="#DE3831"/>
  <!-- Base blue band -->
  <rect width="30" height="10" fill="#002395"/>
  <!-- White band -->
  <path d="M0 5 L0 15 L15 10 Z" fill="#fff"/>
  <!-- Green chevron -->
  <path d="M0 6 L0 14 L13 10 Z" fill="#007A4D"/>
  <!-- Yellow triangle -->
  <path d="M0 7.5 L0 12.5 L9 10 Z" fill="#FFB612"/>
  <!-- Black triangle (left) -->
  <path d="M0 8 L0 12 L5 10 Z" fill="#000"/>
  <!-- Center white band overlay (top + bottom) -->
  <path d="M15 10 L30 0 L30 4 Z" fill="#fff"/>
  <path d="M15 10 L30 16 L30 20 Z" fill="#fff"/>
  <!-- Green horizontal band top -->
  <path d="M15 10 L30 5 L30 8 Z" fill="#007A4D"/>
  <!-- Green horizontal band bottom -->
  <path d="M15 10 L30 12 L30 15 Z" fill="#007A4D"/>
  <!-- Black triangle hint (top-left corner) -->
  <path d="M0 0 L10 0 L5 3 Z" fill="#000" opacity="0"/>
  <!-- Horizontal stripe overlays (top half) -->
  <path d="M15 10 L30 0 L30 5 Z" fill="#DE3831"/>
  <!-- Horizontal stripe overlays (bottom half) -->
  <path d="M15 10 L30 20 L30 15 Z" fill="#002395"/>
</svg>