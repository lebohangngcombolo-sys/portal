<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 20" width="30" height="20" aria-label="Portugal">
  <title>Portugal</title>
  <!-- Green band -->
  <rect width="12" height="20" fill="#046A38"/>
  <!-- Red band -->
  <rect x="12" width="18" height="20" fill="#DA020E"/>
  <!-- Simplified armillary sphere (gold circle) -->
  <circle cx="12" cy="10" r="4" fill="none" stroke="#FFD700" stroke-width="1"/>
  <!-- Simplified shield -->
  <path d="M12 7.2 L15 8 L15 12 L12 12.8 L9 12 L9 8 Z" fill="#fff" stroke="#DA020E" stroke-width="0.3"/>
  <!-- Small blue shield inner -->
  <path d="M12 8.2 L13.5 8.6 L13.5 10.8 L12 11.4 L10.5 10.8 L10.5 8.6 Z" fill="#002395"/>
  <!-- White dots inside shield (simplified) -->
  <circle cx="12" cy="9" r="0.4" fill="#fff"/>
  <circle cx="11.2" cy="9.8" r="0.4" fill="#fff"/>
  <circle cx="12.8" cy="9.8" r="0.4" fill="#fff"/>
  <circle cx="11.6" cy="10.6" r="0.4" fill="#fff"/>
  <circle cx="12.4" cy="10.6" r="0.4" fill="#fff"/>
</svg>